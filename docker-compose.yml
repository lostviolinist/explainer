# Local stack: Postgres, SeaweedFS (S3), Inngest dev server, and the web app.
#   cp .env.example .env   # add HEDRA_API_KEY, OPENAI_API_KEY, EXA_API_KEY
#   docker compose up --build
# App: http://localhost:3000   Inngest runs: http://localhost:8288
#
# The S3 server shares the web container's network so that http://localhost:9000 means the same
# bucket to your browser (playing videos) and to the renderer inside the container.

services:
  web:
    build: .
    ports: ["3000:3000", "9000:9000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/explainer
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: explainer-assets
      S3_ACCESS_KEY_ID: local
      S3_SECRET_ACCESS_KEY: local
      ASSETS_PUBLIC_BASE: http://localhost:9000/explainer-assets
      INNGEST_DEV: http://inngest:8288
      INNGEST_BASE_URL: http://inngest:8288
      RENDER_TARGET: local
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: explainer }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20

  # S3-compatible storage (MinIO no longer publishes Docker images). Runs without auth locally.
  s3:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.port=9000 -ip.bind=0.0.0.0
    network_mode: service:web
    volumes: [s3data:/data]

  # Creates the bucket. With no S3 auth configured, objects are publicly readable for the player.
  s3-init:
    image: curlimages/curl
    network_mode: service:web
    depends_on: [s3]
    entrypoint: >
      sh -c "until curl -sf -X PUT http://localhost:9000/explainer-assets; do sleep 2; done; echo bucket ready"

  inngest:
    image: inngest/inngest
    command: inngest dev -u http://web:3000/api/inngest
    ports: ["8288:8288"]
    depends_on: [web]

volumes:
  pgdata:
  s3data:
