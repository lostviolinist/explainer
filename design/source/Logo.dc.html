<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A99BFF","options":["#A99BFF","#F2B544","#6FD3C1","#FF8FB1"]},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  rgb(hex) {
    const h = String(hex || '').replace('#', '');
    const f = h.length === 3 ? h.split('').map(function (c) { return c + c; }).join('') : h.slice(0, 6);
    const n = parseInt(f, 16);
    if (isNaN(n)) return [169, 155, 255];
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  shade(hex, t) {
    const c = this.rgb(hex);
    const k = 1 - t;
    return 'rgb(' + Math.round(c[0] * k) + ',' + Math.round(c[1] * k) + ',' + Math.round(c[2] * k) + ')';
  }
  tint(hex, t) {
    const c = this.rgb(hex);
    return 'rgb(' + Math.round(c[0] + (255 - c[0]) * t) + ',' + Math.round(c[1] + (255 - c[1]) * t) + ',' + Math.round(c[2] + (255 - c[2]) * t) + ')';
  }
  renderVals() {
    const accent = this.props.accent ?? '#A99BFF';
    return {
      accent: accent,
      accentDeep: this.shade(accent, 0.4),
      accentLight: this.tint(accent, 0.6),
      accentInk: this.shade(accent, 0.3),
      accentInkDeep: this.shade(accent, 0.6)
    };
  }
}
</script>
